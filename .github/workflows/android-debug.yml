name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # npm ci can reject lockfiles generated on Windows when optional native
      # bindings differ on Linux. npm install resolves only the runner's bindings.
      - run: npm install --include=dev
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: animal-party-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish latest debug APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Latest Android Debug APK
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
